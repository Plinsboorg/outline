services:
  redis:
    image: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    user: "redis:redis"
  postgres:
    image: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    user: "postgres:postgres"
    volumes:
      - postgres-data:/var/lib/postgresql
  outline:
    image: outline-outline:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/outline
      REDIS_URL: redis://redis:6379
      PGSSLMODE: disable
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
    ports:
      - "3010:3010"
    volumes:
      - /var/lib/outline/data:/var/lib/outline/data
    command: sh -c "node_modules/.bin/sequelize db:migrate --env=production-ssl-disabled && node build/server/index.js"

volumes:
  postgres-data:
    external: true
    name: "2f0c6561cbc1a6e52c2d3901a7118a8aae514951d7f8ff1050a611ba91653643"
